name: Licensed women's basketball schedule refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh from licensed provider
        env:
          SPORTRADAR_API_KEY: ${{ secrets.SPORTRADAR_API_KEY }}
          SPORTRADAR_BASE_URL: ${{ vars.SPORTRADAR_BASE_URL }}
        run: |
          python sportradar.py --days 8
      - name: Commit schedule only if changed
        run: |
          git config user.name "docs-war-room-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified NCAAW schedule"
            git push
          fi
