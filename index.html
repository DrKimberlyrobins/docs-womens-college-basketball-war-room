<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOC'S Women's College Basketball War Room</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#111;background:white}*{box-sizing:border-box}body{margin:0}header{padding:22px 5%;border-bottom:4px solid #167b42}h1{margin:0;font-size:clamp(23px,4vw,38px)}header p{margin-bottom:0}main{max-width:1200px;margin:auto;padding:20px}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}button,input{font:inherit;padding:10px;border:1px solid #777;border-radius:5px;background:white;color:black}button{cursor:pointer}button.active{background:#e2f5e8;border:2px solid #168343}article{border:1px solid #d4d4d4;border-radius:10px;padding:18px;margin:12px 0}small,.muted{color:#555}.green{color:#136c39;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}table{border-collapse:collapse;width:100%}td,th{padding:10px;text-align:left;border-bottom:1px solid #ddd}#notice{padding:14px;background:#f3f3f3;border-left:4px solid #167b42}@media(max-width:600px){main{padding:12px}nav button{flex:1 1 45%}}
</style></head><body><header><h1>DOC'S WOMEN'S COLLEGE BASKETBALL WAR ROOM</h1><p>Independent projections • Verified records • Evidence-first grading</p></header><main><nav id="nav"></nav><div id="notice" role="status">Loading source-verified records…</div><div><label for="date">Game date (Central): </label><input type="date" id="date"></div><section id="content"></section></main><script>
const tabs=['TODAY','UPCOMING','PREVIOUS','TEAM INTELLIGENCE','SIMULATOR','ACCURACY'];let tab='TODAY',data={games:[],forecasts:[]};const $=id=>document.getElementById(id);const today=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Chicago',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());$('date').value=today;
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function render(){const nav=$('nav');nav.replaceChildren();for(const t of tabs){const b=el('button',t,t===tab?'active':'');b.onclick=()=>{tab=t;render()};nav.append(b)}const root=$('content');root.replaceChildren();const games=Array.isArray(data.games)?data.games:[];if(['TODAY','UPCOMING','PREVIOUS'].includes(tab)){const selected=$('date').value;let matching=games.filter(g=>String(g.tipoff_central||'').slice(0,10)===selected);if(tab==='UPCOMING')matching=games.filter(g=>g.tipoff_utc&&new Date(g.tipoff_utc)>new Date()).sort((a,b)=>a.tipoff_utc.localeCompare(b.tipoff_utc));if(tab==='PREVIOUS')matching=games.filter(g=>g.status==='final');root.append(el('h2',tab+' — '+matching.length+' verified schedule records'));if(!matching.length)root.append(el('p','No verified games are available for this selection.'));for(const g of matching){const a=el('article');a.append(el('h3',(g.away||'Away')+' at '+(g.home||'Home')));a.append(el('p','Central tipoff: '+(g.tipoff_central||'unavailable')+' · Status: '+(g.status||'unavailable')));if(g.status==='final'&&Number.isFinite(g.away_score)&&Number.isFinite(g.home_score))a.append(el('p','Final: '+g.away_score+' – '+g.home_score,'green'));const coverage=g.data_coverage||{};const status=el('p','Data coverage — Schedule: '+(coverage.schedule||'unknown')+' · Team stats: '+(coverage.team_stats||'unknown')+' · Quarter stats: '+(coverage.period_stats||'unknown')+' · Forecast: '+(coverage.forecast||'unknown'),'muted');a.append(status);if(g.data_warning)a.append(el('p',g.data_warning,'muted'));if(g.source_url){const source=el('a','Published schedule');source.href=g.source_url;source.target='_blank';source.rel='noopener noreferrer';a.append(source)}if(g.team_intelligence){const t=g.team_intelligence;const section=el('section');section.append(el('h4','Historical team intelligence ('+t.season+')'));const table=el('table');const head=el('tr');for(const title of ['Statistic',g.away,g.home])head.append(el('th',title));table.append(head);for(const [key,label] of [['ppg','Points/game'],['points_allowed','Points allowed/game'],['rebounds','Rebounds/game'],['assists','Assists/game'],['turnovers','Turnovers/game']]){const row=el('tr');for(const v of [label,t.away[key],t.home[key]])row.append(el('td',String(v)));table.append(row)}section.append(table);section.append(el('p',t.warning,'muted'));a.append(section)}if(g.news){for(const n of g.news){const p=el('p');p.append(el('strong','Team news: '+n.title+' '));const link=el('a','Official report');link.href=n.url;link.target='_blank';link.rel='noopener noreferrer';p.append(link);a.append(p)}}a.append(el('small','Source: '+(g.source||'not supplied')+' · Retrieved: '+(g.retrieved_utc||'not supplied')));root.append(a)}}else{root.append(el('h2',tab));root.append(el('article',tab==='SIMULATOR'?'The 10,000-run engine is implemented in Python. Matchup projections remain unavailable until verified team ratings and calibration are connected.':tab==='ACCURACY'?'No pregame forecasts have been validated against completed games. Accuracy figures are withheld.':'Verified team ratings and player intelligence have not yet been ingested.'))}}
$('date').addEventListener('change',render);fetch('./data/dashboard.json?t='+Date.now()).then(r=>{if(!r.ok)throw Error('Data file unavailable');return r.json()}).then(d=>{data=d;$('notice').textContent=(d.message||'Data loaded')+' · Status: '+(d.status||'unknown');render()}).catch(e=>{$('notice').textContent='Data unavailable: '+e.message;render()});render();
</script></body></html>
