<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOC'S Women's College Basketball War Room</title><style>body{font:16px system-ui;margin:0;color:#111;background:#fff}header{padding:24px;border-bottom:3px solid #178044}main{max-width:1100px;margin:auto;padding:20px}nav{display:flex;flex-wrap:wrap;gap:8px}button{background:white;color:black;border:1px solid #888;padding:12px;cursor:pointer}.active{border-color:#178044;background:#e8f8ed}article{border:1px solid #ddd;border-radius:8px;padding:18px;margin-top:16px}.ok{color:#126d35}small{color:#555}</style><header><h1>DOC'S WOMEN'S COLLEGE BASKETBALL WAR ROOM</h1><p>Independent forecasts · Timestamped evidence · Honest grading</p></header><main><nav id="nav"></nav><section id="body"></section></main><script>
const tabs=['TODAY','UPCOMING','PREVIOUS','TEAM INTELLIGENCE','SIMULATOR','ACCURACY'];
const nav=document.getElementById('nav'),body=document.getElementById('body');
function show(t){nav.innerHTML='';tabs.forEach(x=>{let b=document.createElement('button');b.textContent=x;b.className=x===t?'active':'';b.onclick=()=>show(x);nav.append(b)});
body.innerHTML='<article><h2>'+t+'</h2><p id="status">Loading verified data…</p></article>';
fetch('./data/dashboard.json?cache='+Date.now()).then(r=>{if(!r.ok)throw Error('No verified dataset published');return r.json()}).then(d=>{document.getElementById('status').textContent=d.message||'No verified forecasts available';}).catch(()=>document.getElementById('status').textContent='No verified data available yet. Forecasts are withheld rather than invented.');}show('TODAY');
</script></html>
